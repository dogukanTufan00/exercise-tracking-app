name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install system SQLite (used by tests, see pubspec.yaml hooks)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Galaxy Watch eşlikçi uygulaması (wear/, Kotlin). Flutter işiyle aynı anda çalışır.
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK ve lisanslar; eksik platform (compileSdk 37) Gradle tarafından indirilir.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # İmza anahtarı CI'da yok: release derlemesi debug anahtarıyla imzalanır (app/build.gradle.kts),
      # ama R8 küçültmesi yine çalışır; cihaza kurulan derlemenin aynısı denetlenir.
      - name: Unit tests and release build
        run: bash ./gradlew testDebugUnitTest assembleRelease --console=plain
