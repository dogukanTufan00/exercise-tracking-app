# 14 GB RAM'li geliştirme makinesi: telefon + saat projeleri aynı anda bellekte kalabildiği için sınırlı tutulur.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Boşta kalan Gradle süreci 15 dakika sonra kapanır (bellek boşalır).
org.gradle.daemon.idletimeout=900000
# Değişmeyen görevlerin çıktısı yeniden kullanılır.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
